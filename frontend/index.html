<!doctype html> <!-- Indica que el documento utiliza HTML5 -->
<html lang="es"> <!-- Inicio del documento HTML y se especifica que el idioma es español -->
  
  <head> <!-- Contiene la información de configuración de la página -->
    <meta charset="UTF-8" /> <!-- Define la codificación de caracteres en UTF-8 para permitir letras, tildes y símbolos especiales -->
    <link rel="icon" type="image/svg+xml" href="/peed.svg" /> <!-- Establece el ícono (favicon) que aparecerá en la pestaña del navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Hace que la página sea adaptable a dispositivos móviles (responsive) -->
    <title>PEED</title> <!-- Título que aparecerá en la pestaña del navegador -->

    <!-- Fuente Montserrat desde Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap">
    <!-- Librería de iconos Material Symbols de Google -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <!-- Librería Font Awesome para utilizar iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Librería Boxicons para disponer de otra colección de iconos -->
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
  </head>

  <body> <!-- Contenido visible de la página -->
    <div id="root"></div> <!-- Contenedor principal donde React renderizará toda la aplicación -->
    <script type="module" src="/src/main.jsx"></script> <!-- Carga el archivo principal de React (main.jsx), el cual monta la aplicación en el div con id="root" -->
  </body>

</html>
